<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7F5F0">
<title>Korean Pantry</title>
<style>html,body{margin:0;min-height:100%;background:#F7F5F0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}.loading{min-height:100vh;display:grid;place-items:center;color:#18211C;font-weight:800}.loading span{display:flex;align-items:center;gap:10px}.dot{width:10px;height:10px;border-radius:50%;background:#F07832;animation:p 1s infinite alternate}@keyframes p{to{opacity:.25}}</style>
</head>
<body><div class="loading"><span><i class="dot"></i>Korean Pantry</span></div>
<script>
(async()=>{
  const files=['site-assets-v5/html-0.txt','site-assets-v5/html-1.txt','site-assets-v5/html-2.txt','site-assets-v5/html-3.txt'];
  try{
    const parts=await Promise.all(files.map(async f=>{const r=await fetch(f,{cache:'no-store'});if(!r.ok)throw new Error(f);return r.text();}));
    document.open();document.write(parts.join(''));document.close();
  }catch(e){document.body.innerHTML='<div class="loading">Korean Pantry</div>';console.error(e);}
})();
</script></body></html>
